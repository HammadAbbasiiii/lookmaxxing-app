services:
  - type: web
    name: lookmaxx-api
    runtime: python
    repo: https://github.com/HammadAbbasiiii/lookmaxxing-app
    plan: pro
    region: frankfurt
    buildCommand: |
      set -e
      cd backend
      python -m venv venv
      source venv/bin/activate
      pip install --upgrade pip
      pip install -r requirements.txt
      # Download MediaPipe face landmarker model (~3.6 MB float16). Fail the
      # build if the download is empty or truncated — a partial .task file
      # passes a simple existence check but fails at inference time.
      mkdir -p app/ml
      curl -fsSL -o app/ml/face_landmarker.task \
        https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
      _mp_size=$(wc -c < app/ml/face_landmarker.task)
      if [ "$_mp_size" -lt 3000000 ]; then
        echo "❌ MediaPipe model download failed/truncated (${_mp_size} bytes)"
        exit 1
      fi
      echo "✅ MediaPipe model pre-downloaded (${_mp_size} bytes)"
    startCommand: |
      cd backend
      source venv/bin/activate
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REDIS_URL
        sync: false
      - key: MODEL_PATH
        value: app/ml/rank_info_net_full.pth
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: 1
      - key: UVICORN_WORKERS
        value: 1
      - key: TORCH_COMPILE_THREADS
        value: 1
      - key: OMP_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: PYTHONPATH
        value: /opt/render/project/src/backend

  - type: redis
    name: lookmaxx-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

